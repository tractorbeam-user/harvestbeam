# Xcode project for signed builds (iPhone/iPad, and a Mac build with iCloud
# favorites sync). Needs full Xcode and XcodeGen:
#   brew install xcodegen && xcodegen && open HarvestBar.xcodeproj
# Set DEVELOPMENT_TEAM below (or in Xcode → Signing) before building to a device.
name: HarvestBar
options:
  bundleIdPrefix: com.tractorbeam
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
packages:
  HarvestBar:
    path: .
targets:
  HarvestBar-iOS:
    type: application
    platform: iOS
    sources: [iOS]
    dependencies:
      - package: HarvestBar
        product: HarvestUI
      - package: HarvestBar
        product: HarvestKit
    entitlements:
      path: iOS/HarvestBar.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.tractorbeam.harvestbar
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Harvest Bar
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tractorbeam.harvestbar
        TARGETED_DEVICE_FAMILY: "1,2"
  HarvestBar-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/HarvestBar
    dependencies:
      - package: HarvestBar
        product: HarvestUI
      - package: HarvestBar
        product: HarvestKit
    entitlements:
      path: macOS/HarvestBar.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.tractorbeam.harvestbar
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: Harvest Bar
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tractorbeam.harvestbar
        PRODUCT_NAME: Harvest Bar
